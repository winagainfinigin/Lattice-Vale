name: Temporary source snapshot for isolated review
on:
  push:
    branches:
      - review/14.7.0-zero-regressions
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Archive exact checked-out repository
        run: git archive --format=zip --output="$RUNNER_TEMP/lv147-source.zip" HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lv147-source-snapshot
          path: ${{ runner.temp }}/lv147-source.zip
          if-no-files-found: error
          retention-days: 1
