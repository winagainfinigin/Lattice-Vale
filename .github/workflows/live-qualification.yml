name: Manual Windows and WSL qualification

on:
  workflow_dispatch:
    inputs:
      disposable_stack_path:
        description: Windows path to an isolated stack containing the qualification marker
        required: true
        type: string
      wsl_distro:
        description: WSL distribution containing Docker and the marked stack
        required: true
        type: string
      run_directml_inference:
        description: Run one non-streaming DirectML inference on this dedicated runner
        required: true
        type: boolean
        default: false
      directml_endpoint:
        description: Windows-hosted DirectML gateway endpoint
        required: false
        type: string
        default: http://127.0.0.1:11436

permissions:
  contents: read

jobs:
  live-qualification:
    if: inputs.disposable_stack_path != '' && inputs.wsl_distro != ''
    runs-on: [self-hosted, windows, latticevale-qualification]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check explicit disposable-stack marker
        shell: pwsh
        env:
          QUALIFICATION_STACK: ${{ inputs.disposable_stack_path }}
        run: |
          $marker = Join-Path $env:QUALIFICATION_STACK '.latticevale-qualification-stack'
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw 'Missing .latticevale-qualification-stack marker; no runtime command was run.' }
          if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne 'DISPOSABLE LATTICEVALE QUALIFICATION STACK') { throw 'Qualification marker content did not match.' }
      - name: Run bounded WSL verification and load probe
        shell: pwsh
        env:
          QUALIFICATION_STACK: ${{ inputs.disposable_stack_path }}
          QUALIFICATION_DISTRO: ${{ inputs.wsl_distro }}
        run: |
          $repoLinux = (& wsl.exe -d $env:QUALIFICATION_DISTRO -- wslpath -u $env:GITHUB_WORKSPACE).Trim()
          $stackLinux = (& wsl.exe -d $env:QUALIFICATION_DISTRO -- wslpath -u $env:QUALIFICATION_STACK).Trim()
          $outputLinux = (& wsl.exe -d $env:QUALIFICATION_DISTRO -- wslpath -u "$env:RUNNER_TEMP\latticevale-live-qualification.json").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $repoLinux -or -not $stackLinux -or -not $outputLinux) { throw 'Could not resolve qualification paths in WSL.' }
          wsl.exe -d $env:QUALIFICATION_DISTRO -- python3 "$repoLinux/LatticeVale-Core/tests/live-qualification.py" --stack "$stackLinux" --duration-seconds 300 --output "$outputLinux"
          if ($LASTEXITCODE -ne 0) { throw 'The bounded WSL qualification did not pass.' }
      - name: Run DirectML inference check
        if: inputs.run_directml_inference
        shell: pwsh
        env:
          DIRECTML_ENDPOINT: ${{ inputs.directml_endpoint }}
          OUTPUT_FILE: ${{ runner.temp }}\latticevale-directml-qualification.json
        run: .\tools\Test-LatticeVale-DirectMLInference.ps1 -Endpoint $env:DIRECTML_ENDPOINT -OutputPath $env:OUTPUT_FILE
      - name: Upload sanitized qualification summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LatticeVale-live-qualification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/latticevale-live-qualification.json
            ${{ runner.temp }}/latticevale-directml-qualification.json
          if-no-files-found: ignore
          retention-days: 7
