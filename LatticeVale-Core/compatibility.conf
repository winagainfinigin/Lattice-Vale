# LatticeVale compatibility policy. This file is the single executable source
# of truth consumed by both Install-LatticeVale.ps1 and linux/bootstrap.sh.
SUPPORTED_UBUNTU_VERSIONS="22.04 24.04 26.04"
MIN_WINDOWS_BUILD=19041
DIRECTML_MIN_WINDOWS_BUILD=22000
SUPPORTED_WSL_ARCHITECTURES="x86_64"
MIN_HOST_PARTITION_TOTAL_GIB_EXCLUSIVE=50
MIN_HOST_PARTITION_FREE_GIB=50
MIN_MANAGED_REPAIR_FREE_GIB=10
# Legacy compatibility field retained for older installer metadata; no longer gates Option 1.
MANAGED_REPAIR_REFRESH_DAYS=30
# Retained for interrupted managed-refresh marker compatibility. Option 1 now
# uses available upstream versions rather than the elapsed-days/policy gate.
# VERSION.txt alone is not a managed-refresh trigger.
MANAGED_REPAIR_REFRESH_REVISION=5
# v14.5.43 universal Resume / repair can migrate any proven installer-managed
# recognized historical stack directly to the current release. Unproven/corrupt layouts fail closed.
MIN_UNIVERSAL_REPAIR_MAJOR=0
INSTALL_OPTIONS_SCHEMA=24
HARDWARE_CAPABILITIES_SCHEMA=1
BACKEND_CAPABILITIES_SCHEMA=1
BACKEND_HEALTH_SCHEMA=1
RUNTIME_POLICY_SCHEMA=13
DIAGNOSTICS_SCHEMA=1
WSL_PROBE_TIMEOUT_SECONDS=15
